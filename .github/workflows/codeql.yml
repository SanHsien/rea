name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }} security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Languages follow the code this repository ships: the TypeScript product and
        # scripts, the Python bridges, the Ghidra Java bridge and the workflows. C and
        # Swift fixtures are not scanned; Java and JavaScript fixtures under tests/ are
        # analysed along with the rest.
        language: ["javascript-typescript", "python", "java-kotlin", "actions"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          # Dependabot-triggered runs have historically had a read-only token and failed the
          # SARIF upload, so they scan without uploading; pushes to main upload as usual.
          upload: ${{ github.actor != 'dependabot[bot]' }}
